server {
	host 0.0.0.0;
	port 4242;
	client_max_body_size 1000000;
	error_page 404 ./www/404.html;

	location / {
		root ./www;
		index index.html;
		methods GET POST;
		autoindex off;
		upload_dir ./uploads;
		cgi .py /usr/bin/python3;
		cgi .sh /bin/bash;
	}

	location /old {
		root ./www;
		methods GET;
		return /;
	}

	location /uploads {
		root ./uploads;
		index index.html;
		methods GET POST DELETE;
		upload_dir ./uploads;
		autoindex on;
	}
}

server {
	host 0.0.0.0;
	port 4243;
	client_max_body_size 500;
	error_page 404 ./www2/404.html;

	location / {
		root ./www2;
		index index.html;
		methods GET;
		autoindex off;
	}
}